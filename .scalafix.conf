rules = [
  OrganizeImports,
  RemoveUnused,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  RedundantSyntax,
  ScaladocOnly,
  FileLength,
  CommentDensity,
  NoGenericWords
]

OrganizeImports {
  targetDialect = Scala3
  removeUnused = true
  groupedImports = Merge
  groups = ["re:javax?\\.", "scala.", "*"]
}

DisableSyntax {
  noNulls = true
  noReturns = true
  noThrows = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noXml = true
  noFinalize = true
  noVars = true
  noWhileLoops = true
}

# Generic words banned inside defined names. "arm" stays banned, but the grammar's own
# match/handler-arm terms (spec/syntax_grammar.ebnf) are allowed by exact name.
NoGenericWords {
  words = [grain, leg, arm, stuff, helper, thing]
  allowedNames = [
    MatchArm, HandlerArm, ReturnArm, matchArm, matchArms, handlerArms, returnArm,
    parseMatchArm, parseMatchArms, parseHandlerArm, parseHandlerArms
  ]
}
