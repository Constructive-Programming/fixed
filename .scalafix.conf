rules = [
  OrganizeImports,
  RemoveUnused,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  RedundantSyntax
]

OrganizeImports {
  targetDialect = Scala3
  removeUnused = true
  groupedImports = Merge
  groups = ["re:javax?\\.", "scala.", "*"]
}

DisableSyntax {
  noNulls = true
  noReturns = true
  noThrows = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noXml = true
  noFinalize = true
  noVars = true
  noWhileLoops = true
}
