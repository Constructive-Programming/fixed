name: Deploy docs site

# Builds the Laika site via `sbt docs/tlSite` and publishes the static
# HTML to Cloudflare Pages — the same mechanism as the sister project eo.
#
# Trigger paths:
#   - Pull request    → preview deployment tagged with the head branch
#                       name; sticky comment lands on the PR with the
#                       deployment URL.
#   - Push to `main`  → preview deployment tagged `main`
#
# Both flows use the same Pages project (`fixed-docs` by default);
# Cloudflare assigns each non-production deployment its own preview
# URL. NB: the project that owns the fixed.constructive.dev custom
# domain must be the one named here — override with the repo variable
# CLOUDFLARE_PAGES_PROJECT if it differs.
#
# Fork-PR caveat: secrets aren't exposed to workflows triggered by PRs
# from forks, so this job silently no-ops for fork PRs. All current
# contributors push branches inside the same repo, so this is
# acceptable (same trade-off as eo).

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Group by branch / PR so a new push to the same PR cancels the
  # in-flight build. `github.head_ref` is set on PR events;
  # `github.ref` covers pushes.
  group: deploy-site-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Skip for PRs from forks — they can't access the Cloudflare
    # secrets and would fail noisily.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # `pages deploy` only needs a Cloudflare API token, but keeping
      # permissions minimal closes the "compromised workflow can push
      # to the repo" blast radius. PR runs also need pull-requests:write
      # so the sticky comment step can post / update its message.
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Cache coursier + ivy + sbt boot
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/**/*.scala') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build site
        run: sbt docs/tlSite

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `github.head_ref` is the source branch on PR events;
          # falls back to `github.ref_name` (`main`) on push events.
          command: >-
            pages deploy site/target/docs/site
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'fixed-docs' }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Post preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-pages-preview
          message: |
            :rocket: **Cloudflare Pages preview** for `${{ github.head_ref }}` is live:

            ${{ steps.deploy.outputs.deployment-url }}

            <sub>Built from commit `${{ github.event.pull_request.head.sha }}` · updated on every push.</sub>
