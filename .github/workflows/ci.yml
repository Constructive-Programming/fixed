name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commit-messages:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Same rules as .githooks/commit-msg, over every new commit in the push
      # or pull request (catches commits made with --no-verify or outside sbt).
      - name: Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$SHA~1..$SHA"
          else
            range="$BEFORE..$SHA"
          fi
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || { echo "  in commit $sha"; status=1; }
          done
          exit $status

  check:
    name: check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v9
      # The backend tests link with clang; fail here, not in a skipped test, if it is missing.
      - run: clang --version
      # Same gate as .githooks/pre-commit: scalafmt, scalafix, CPD, tests.
      - run: sbt check test
