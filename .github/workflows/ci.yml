name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v9
      # Same gate as .githooks/pre-commit: scalafmt, scalafix, CPD, tests.
      - run: sbt check test
